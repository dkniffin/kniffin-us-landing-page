<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kniffin Self-hosted</title>
  <meta name="description" content="Kniffin family home page">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233b6ef5'/><text x='16' y='22' font-family='Arial,sans-serif' font-size='17' font-weight='700' fill='white' text-anchor='middle'>K</text></svg>">
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1c1f24;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 12px rgba(0, 0, 0, .04);
      --shadow-hover: 0 2px 4px rgba(0, 0, 0, .06), 0 10px 24px rgba(0, 0, 0, .08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317;
        --card: #1a1d23;
        --text: #eceef1;
        --muted: #9aa1ac;
        --border: #2a2e36;
        --shadow: none;
        --shadow-hover: 0 8px 24px rgba(0, 0, 0, .35);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    main {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 64px 20px 40px;
      flex: 1;
    }

    header {
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      list-style: none;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 100%;
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .card:focus-visible {
      outline: 2px solid #3b6ef5;
      outline-offset: 2px;
    }

    .icon {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--muted);
    }

    .icon svg {
      width: 24px;
      height: 24px;
    }

    .icon img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .info h2 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .info p {
      font-size: .9rem;
      color: var(--muted);
    }

    .arrow {
      color: var(--muted);
      opacity: .5;
      transition: opacity .15s ease, transform .15s ease;
    }

    .card:hover .arrow {
      opacity: 1;
      transform: translateX(2px);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
      padding: 24px 20px 32px;
    }

    @media (max-width: 600px) {
      main {
        padding-top: 40px;
      }

      header h1 {
        font-size: 1.6rem;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>kniffin.us Self-Hosted</h1>
    </header>
    <ul class="grid" id="sites"></ul>
  </main>

  <footer>&copy; <span id="year"></span> kniffin.us</footer>

  <script>
    // ============================================================
    //  SITES: edit this list to add, remove, or reorder cards.
    //
    //  name  - Title shown on the card
    //  desc  - Short description under the title
    //  url   - Where the card links to
    //  icon  - A Dashboard Icons name (browse them at dashboardicons.com),
    //          e.g. "plex". You can also paste a full image URL instead.
    // ============================================================
    const sites = [
      {
        name: "Plex",
        desc: "Movies & TV Shows",
        url: "https://app.plex.tv",
        icon: "plex",
      },
      {
        name: "Seer",
        desc: "Request Movies & TV Shows",
        url: "https://seer.kniffin.us",
        icon: "seerr",
      },
      {
        name: "Audiobookshelf",
        desc: "Audiobooks",
        url: "https://media.kniffin.us:8282/",
        icon: "audiobookshelf",
      },
      {
        name: "Books",
        desc: "eBooks",
        url: "https://books.kniffin.us",
        icon: "calibre-web",
      },
      {
        name: "Zoho",
        desc: "Email",
        url: "https://mail.zoho.com",
        icon: "zohomail",
      },
      {
        name: "FoundryVTT",
        desc: "RPG",
        url: "https://rpg.kniffin.us:30000",
        icon: "foundry-vtt",
      },
    ]

    // ---- You shouldn't need to edit anything below this line ----

    const ICON_CDN = "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons"

    const svg = inner =>
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`

    const fallbackIcon = svg('<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>')

    // Tries the SVG first, then the PNG, then shows a generic link icon.
    function iconError(img) {
      const png = img.dataset.png
      if (png && img.src !== png) {
        img.src = png
      } else {
        img.parentElement.innerHTML = fallbackIcon
      }
    }

    function iconHtml(icon) {
      if (!icon) return fallbackIcon
      if (icon.includes("/")) {
        return `<img src="${icon}" alt="" loading="lazy" onerror="iconError(this)">`
      }
      return `<img src="${ICON_CDN}/svg/${icon}.svg" data-png="${ICON_CDN}/png/${icon}.png" alt="" loading="lazy" onerror="iconError(this)">`
    }

    document.getElementById("sites").innerHTML = sites.map(s => `
      <li>
        <a class="card" href="${s.url}">
          <span class="icon">${iconHtml(s.icon)}</span>
          <span class="info">
            <h2>${s.name}</h2>
            <p>${s.desc}</p>
          </span>
          <span class="arrow">${svg('<polyline points="9 18 15 12 9 6"/>')}</span>
        </a>
      </li>`).join("")

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>

</html>
